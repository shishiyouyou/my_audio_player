upstream music_hub_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    # Compatibility for Android clients whose base URL is /music.
    location /music/api/ {
        rewrite ^/music(/api/.*)$ $1 break;
        proxy_pass http://music_hub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /music;
        proxy_set_header X-Accel-Redirect-Enabled 1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }

    location /music/admin/ {
        rewrite ^/music(/admin/.*)$ $1 break;
        proxy_pass http://music_hub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /music;
        proxy_set_header X-Accel-Redirect-Enabled 1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    # API and admin traffic
    location / {
        proxy_pass http://music_hub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Accel-Redirect-Enabled 1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }

    # Media is served through X-Accel-Redirect from the backend.
    location /music-media/ {
        internal;
        alias /home/music/code/backend/data/music/;
        sendfile on;
        aio threads;
        directio 4m;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff;
    }

    location /api/ {
        proxy_pass http://music_hub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Accel-Redirect-Enabled 1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    location /admin/ {
        proxy_pass http://music_hub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Accel-Redirect-Enabled 1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }
}
